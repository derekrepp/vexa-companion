    <base href="/vexa-companion/" />
    <script>
      // GitHub Pages SPA — restore URL encoded by 404.html
      (function(l) {
        if (l.search[1] === '/') {
          var parts = l.search.slice(1).split('&').map(function(s) { return s.replace(/~and~/g, '&'); });
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + parts[0] +
            (parts[1] ? '?' + parts[1] : '') +
            l.hash);
        }
      }(window.location));
    </script>
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />

    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>
